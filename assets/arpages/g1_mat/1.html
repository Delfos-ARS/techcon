<!doctype html>
<html lang="es">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- aframe-extras es opcional; quítalo mientras depuras -->
    <!-- <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script> -->
    <style>body,html{margin:0;padding:0;overflow:hidden}</style>
  </head>
  <body>
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
      mindar-image="imageTargetSrc: ./assets/arpages/g1_mat/m1/targets.mind"
    >
      <a-assets timeout="30000">
        <a-asset-item id="model" src="./assets/arpages/g1_mat/m1/1.glb"></a-asset-item>
      </a-assets>

      <!-- Cámara recomendada por MindAR -->
      <a-camera look-controls="enabled: false" position="0 0 0"></a-camera>

      <!-- Luz básica para ver el modelo -->
      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="0 1 1"></a-entity>

      <!-- Coloca el modelo en el origen del target -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          src="#model"
          position="0 0 0"
          rotation="0 180 0"
          scale="0.5 0.5 0.5">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
