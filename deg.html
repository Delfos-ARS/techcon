
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MusicApp - Degradados</title>

    <style>

        /* Configuración general de la página */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Encabezado */
        header {
            padding: 25px;
            text-align: center;
            color: white;

            /* Degradado lineal */
            background: linear-gradient(to right, #3f51b5, #9c27b0);
        }

        /* Contenedor principal */
        main {
            width: 80%;
            margin: 40px auto;
            text-align: center;
        }

        /* Contenedor de los botones */
        .botones {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        /* Estilo general de los botones */
        button {
            width: 180px;
            height: 100px;
            margin: 15px;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* Botón con un solo color */
        .solido {
            background-color: #3f51b5;
        }

        /* Botón con degradado lineal */
        .lineal {
            background: linear-gradient(to right, #3f51b5, #e91e63);
        }

        /* Botón con degradado radial */
        .radial {
            background: radial-gradient(circle, #ffeb3b, #ff5722);
        }

        /* Efecto al pasar el mouse */
        button:hover {
            transform: scale(1.05);
        }

    </style>
</head>

<body>

    <header>
        <h1>🎵 MusicApp</h1>
        <p>Descubre nuevos colores para tu aplicación</p>
    </header>

    <main>

        <h2>¿Cuál diseño elegirías?</h2>

        <p>
            Observa los diferentes fondos 
        </p>

        <div class="botones">

            <!-- Botón con un color -->
            <button class="solido">
                
            </button>

            <!-- Botón con degradado lineal -->
            <button class="lineal">
                
            </button>

            <!-- Botón con degradado radial -->
            <button class="radial">
                
            </button>

        </div>

    </main>

</body>
</html>
